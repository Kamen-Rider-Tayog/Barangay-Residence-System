<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barangay San Francisco Login</title>
    <!-- Path updated to the css folder -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-container">
        <a href="index.html" class="logo-link">
            <div class="logo-circle">
                <img src="asset/logo.png" alt="Logo" class="logo-img">
            </div>
        </a>
        
        <h1>Barangay San Francisco</h1>
        <p class="subtitle">Login to your account</p>
        
        <div class="login-card">
            <div id="errorMessage" class="error-alert">
                Invalid email or password. Please try again.
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="emailInput">Email or Username</label>
                    <div class="input-wrapper">
                        <div class="input-icon">
                            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        </div>
                        <input type="text" id="emailInput" class="form-control" placeholder="Enter your email" required autocomplete="username">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="passwordInput">Password</label>
                    <div class="input-wrapper">
                        <div class="input-icon">
                          <svg class="icon-svg" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        </div>  
                        
                        <input type="password" id="passwordInput" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                        
                        <button type="button" class="toggle-password" id="togglePass" aria-label="Toggle password visibility">
                            <svg id="eyeIcon" class="icon-svg" viewBox="0 0 24 24">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="login-btn">Login</button>
            </form>
        </div>

        <a href="index.html" class="back-home">
            <svg class="icon-svg" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Home
        </a>
    </div>

    <!-- Path updated to the js folder -->
    <script src="js/login.js"></script>
</body>
</html>
